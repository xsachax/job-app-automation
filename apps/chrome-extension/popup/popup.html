<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Application Autofill</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <div>
        <h1>Application autofill</h1>
        <p data-mode>Loading...</p>
      </div>
      <label class="switch">
        <input data-enabled type="checkbox" aria-label="Enable extension">
        <span></span>
      </label>
    </header>

    <main>
      <div class="notice" data-notice hidden></div>
      <section class="progress" data-progress hidden>
        <div><strong data-answered>0 / 0</strong><span>answered</span></div>
        <div><strong data-attention>0</strong><span>need attention</span></div>
      </section>
      <button class="primary" data-fill type="button">Autofill current page</button>
      <button data-options type="button">Edit profile and setup</button>
    </main>

    <footer>
      <span>Extension ID</span>
      <code data-extension-id></code>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
